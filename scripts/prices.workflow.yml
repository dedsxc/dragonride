name: Mise à jour des prix
on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scrape.py
      - run: |
          sed -i -E "s#\?v=[0-9]+#?v=$(date +%s)#g" index.html
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "Prix du $(date +%F)" && git push)
